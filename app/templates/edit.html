{% extends "base.html" %}
{% block title %}Редактировать {{ book['title'] }}{% endblock %}

{% block content %}
<h1>Редактировать книгу</h1>
<form method="post">
    <label>Название:</label>
    <input type="text" name="title" value="{{ book['title'] }}">

    {% if book['lang'] == "en-ru" %}
        <label>Оригинальное название:</label>
        <input type="text" name="orig_name" value="{{ book['orig_name'] }}">
    {% endif %}

    <label>Автор:</label>
    <input type="text" name="author" value="{{ book['author'] }}">

    <label>Описание:</label>
    <textarea name="description" rows="6">{{ book['description'] }}</textarea>

    <label>Теги (через запятую):</label>
    <input type="text" name="tags" value="{{ tags }}">

    <label>Язык:</label>
    <select name="lang">
        {% for lang in ['ru', 'en', 'en-ru'] %}
        <option value="{{ lang }}" {% if book['lang'] == lang %}selected{% endif %}>{{ lang }}</option>
        {% endfor %}
    </select>

    <button type="submit">Сохранить</button>
</form>
<p><a href="{{ url_for('book.view_book', book_id=book['id']) }}">Назад</a></p>
{% endblock %}
